<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>KennCo · Pic1</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap">
  <style>
    @font-face {
      font-family: Poppins;
      src: url("assets/fonts/poppins-regular-latin.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    :root {
      --font-heading: "Plus Jakarta Sans", sans-serif;
      --font-sans: Poppins, sans-serif;
      --color-brand-blue: #035086;
      --color-ink: #06385b;
      font-family: var(--font-sans);
      color: var(--color-ink);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    .hero { overflow: hidden; background: linear-gradient(105deg, #edf9e7, #e0f2ee 46%, #d1eafa); }
    .hero-inner {
      width: min(calc(100% - 3rem), clamp(83rem, 81vw, 110rem));
      margin-inline: auto;
      position: relative;
      isolation: isolate;
      display: grid;
      align-items: start;
      min-block-size: clamp(18rem, 24vw, 21rem);
    }
    .hero-copy {
      grid-area: 1 / 1;
      padding-block: 1.5rem 2.5rem;
      position: relative;
      z-index: 1;
      width: min(50%, 36rem);
    }
    .hero-breadcrumb ol {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .5rem;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: .875rem;
      line-height: 1.5;
    }
    .hero-breadcrumb a { color: inherit; text-underline-offset: .15em; }
    .hero-description {
      margin: .875rem 0 0;
      font-size: clamp(.9375rem, 1.15vw, 1.0625rem);
      line-height: 1.65;
      text-wrap: balance;
    }
    .hero-title {
      margin: 2.1875rem 0 0;
      color: var(--color-brand-blue);
      font: 800 clamp(2rem, 3.3vw, 3.25rem)/1.12 var(--font-heading);
      letter-spacing: -.04em;
    }
    .hero-photo {
      --headroom-rows: 36;
      --headroom: calc(var(--headroom-rows) * 1px);
      --photo-source: url("assets/shutterstock_1653287707.jpg");
      position: relative;
      grid-area: 1 / 1;
      justify-self: end;
      margin-inline-end: clamp(0rem, 2vw, 2.5rem);
      inline-size: min(63%, 43rem);
      mask-image:
        radial-gradient(ellipse 83% 118% at 56% 48%, #000 44%, rgb(0 0 0 / 84%) 60%, transparent 100%),
        linear-gradient(108deg, transparent, rgb(0 0 0 / 70%) 22%, #000 43% 90%, transparent),
        linear-gradient(to right, transparent 4%, rgb(0 0 0 / 32%) 15%, #000 34%),
        linear-gradient(to bottom, #000 93%, rgb(0 0 0 / 60%) 97%, transparent),
        linear-gradient(to right, #000 72%, rgb(0 0 0 / 78%) 80%, rgb(0 0 0 / 26%) 90%, transparent 96%);
      mask-composite: intersect;
    }
    .hero-photo-frame {
      position: relative;
      padding-block-start: var(--headroom);
      /* A broad, off-centre fade blends the extension and the photo together. */
      mask-image: radial-gradient(ellipse 108% 110% at 62% 109%,
        #000 78%, rgb(0 0 0 / 96%) 82%, rgb(0 0 0 / 84%) 86%,
        rgb(0 0 0 / 60%) 90%, rgb(0 0 0 / 32%) 94%,
        rgb(0 0 0 / 9%) 97%, transparent 99%);
    }
    /* Extend the top row into the added headroom. Both use the same mask. */
    .hero-photo-frame::before {
      content: "";
      position: absolute;
      inset-inline: 0;
      inset-block-start: calc(var(--headroom) - 1px);
      block-size: 1px;
      background: var(--photo-source) center top / 100% auto no-repeat;
      transform: scaleY(var(--headroom-rows));
      transform-origin: bottom;
    }
    .hero-photo img {
      position: relative;
      display: block;
      inline-size: 100%;
      block-size: auto;
    }

    @media (min-width: 1440px) {
      :root { font-size: clamp(16px, calc(10.857px + .35714vw), 22px); }
    }
    @media (max-width: 1023px) {
      .hero-inner { min-block-size: 0; grid-template-columns: minmax(0, 1fr); }
      .hero-copy { width: min(100%, 36rem); padding-block: 1rem 0; }
      .hero-title { margin-block-start: 1.25rem; }
      .hero-photo {
        --headroom-rows: 30;
        grid-area: auto;
        justify-self: center;
        inline-size: 100vw;
        margin-inline-end: 0;
        margin-block-start: -.875rem;
        mask-image: linear-gradient(to bottom, #000 93%, rgb(0 0 0 / 60%) 97%, transparent);
      }
    }
    @media (min-width: 600px) and (max-width: 1023px) {
      .hero-inner { width: calc(100% - 5rem); }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero pic1" aria-labelledby="hero-title">
      <div class="hero-inner">
        <div class="hero-copy">
          <nav class="hero-breadcrumb" aria-label="Breadcrumb">
            <ol>
              <li><a href="/">Home</a></li>
              <li aria-hidden="true">/</li>
              <li aria-current="page">Pic1</li>
            </ol>
          </nav>
          <h1 class="hero-title" id="hero-title">Pic1</h1>
          <p class="hero-description">KennCo Insurance is a growing company that understands the importance of nurturing a motivated and skilled workforce.</p>
        </div>
        <div class="hero-photo">
          <div class="hero-photo-frame">
            <img src="assets/shutterstock_1653287707.jpg" alt="" width="2048" height="1365" fetchpriority="high">
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
